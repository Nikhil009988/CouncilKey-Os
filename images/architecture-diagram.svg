<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12141f"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">CouncilKey-Os — Architecture</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">3 agents debate → council votes → journal + memory · everything local, data on your pendrive</text>

  <!-- Row 1: User -->
  <rect x="420" y="100" width="360" height="54" rx="10" fill="#1a1d29" stroke="#6366f1" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">You</text>
  <text x="600" y="143" text-anchor="middle" fill="#94a3b8" font-size="11">Dashboard (localhost:8443) · CLI (councilkey) · REST API · WebSocket</text>

  <!-- Arrow down -->
  <line x1="600" y1="154" x2="600" y2="184" stroke="#6366f1" stroke-width="2"/>
  <polygon points="594,180 600,192 606,180" fill="#6366f1"/>

  <!-- Row 2: Orchestrator -->
  <rect x="360" y="194" width="480" height="52" rx="10" fill="#1e2033" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>
  <text x="600" y="217" text-anchor="middle" fill="#c7d2fe" font-size="15" font-weight="700">Council Orchestrator (FastAPI)</text>
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="11">ask · decompose · debate · stream · tasks · audit · search · vault · terminal guard</text>

  <!-- Row 3: three agents -->
  <line x1="600" y1="246" x2="600" y2="272" stroke="#6366f1" stroke-width="2"/>
  <line x1="240" y1="272" x2="960" y2="272" stroke="#475569" stroke-width="1.5"/>
  <line x1="240" y1="272" x2="240" y2="292" stroke="#6366f1" stroke-width="2"/>
  <line x1="600" y1="272" x2="600" y2="292" stroke="#6366f1" stroke-width="2"/>
  <line x1="960" y1="272" x2="960" y2="292" stroke="#6366f1" stroke-width="2"/>
  <polygon points="234,288 240,300 246,288" fill="#6366f1"/>
  <polygon points="594,288 600,300 606,288" fill="#6366f1"/>
  <polygon points="954,288 960,300 966,288" fill="#6366f1"/>

  <rect x="120" y="302" width="240" height="78" rx="10" fill="#1a1d29" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="326" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">🧙 Hermes</text>
  <text x="240" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">memory &amp; analysis</text>
  <text x="240" y="364" text-anchor="middle" fill="#6ee7b7" font-size="10">brain: Ollama qwen2.5:3b</text>

  <rect x="480" y="302" width="240" height="78" rx="10" fill="#1a1d29" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="326" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">🦞 OpenClaw</text>
  <text x="600" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">action &amp; execution</text>
  <text x="600" y="364" text-anchor="middle" fill="#93c5fd" font-size="10">brain: Ollama qwen2.5:3b</text>

  <rect x="840" y="302" width="240" height="78" rx="10" fill="#1a1d29" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="960" y="326" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">🔧 Agent Zero</text>
  <text x="960" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">builder &amp; review</text>
  <text x="960" y="364" text-anchor="middle" fill="#c4b5fd" font-size="10">brain: Ollama deepseek-coder</text>

  <!-- Backend note -->
  <text x="600" y="404" text-anchor="middle" fill="#64748b" font-size="11">backend fallback: external agent gateway (🟢) → local LLM (🟡) → explicit mock (⚪)</text>

  <!-- Row 4: vote -->
  <line x1="240" y1="380" x2="240" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="380" x2="600" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="960" y1="380" x2="960" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="240" y1="420" x2="960" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="420" x2="600" y2="440" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="594,436 600,448 606,436" fill="#f59e0b"/>

  <rect x="420" y="450" width="360" height="56" rx="10" fill="#1a1d29" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="473" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">Council Vote</text>
  <text x="600" y="491" text-anchor="middle" fill="#94a3b8" font-size="11">majority · weighted · LLM judge · hermes decides — 2/3 consensus by default</text>

  <!-- Row 5: outputs -->
  <line x1="600" y1="506" x2="600" y2="532" stroke="#6366f1" stroke-width="2"/>
  <polygon points="594,528 600,540 606,528" fill="#6366f1"/>
  <line x1="600" y1="532" x2="180" y2="532" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="532" x2="1020" y2="532" stroke="#475569" stroke-width="1.5"/>
  <line x1="180" y1="532" x2="180" y2="556" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="532" x2="600" y2="556" stroke="#475569" stroke-width="1.5"/>
  <line x1="1020" y1="532" x2="1020" y2="556" stroke="#475569" stroke-width="1.5"/>

  <rect x="60" y="558" width="240" height="60" rx="10" fill="#1a1d29" stroke="#475569" stroke-width="1"/>
  <text x="180" y="582" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Journal + Audit</text>
  <text x="180" y="599" text-anchor="middle" fill="#94a3b8" font-size="10">every decision, latency, consensus rate</text>

  <rect x="480" y="558" width="240" height="60" rx="10" fill="#1a1d29" stroke="#475569" stroke-width="1"/>
  <text x="600" y="582" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Memory + Knowledge</text>
  <text x="600" y="599" text-anchor="middle" fill="#94a3b8" font-size="10">graph · TF-IDF search · RAG injection</text>

  <rect x="900" y="558" width="240" height="60" rx="10" fill="#1a1d29" stroke="#475569" stroke-width="1"/>
  <text x="1020" y="582" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Storage split</text>
  <text x="1020" y="599" text-anchor="middle" fill="#94a3b8" font-size="10">keep: distilled · cache: auto-deleted</text>
</svg>
