<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.5" stop-color="#0b0d17"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e2235" stroke-width="0.6" opacity="0.5">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Header -->
  <rect x="360" y="22" width="560" height="66" rx="14" fill="#141630" stroke="#6366f1" stroke-width="1" opacity="0.95" filter="url(#card)"/>
  <text x="640" y="50" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="800" letter-spacing="1">COUNCILKEY-OS</text>
  <text x="640" y="72" text-anchor="middle" fill="#94a3b8" font-size="12">3 agents debate · council votes · memory persists — fully local</text>

  <!-- Layer 1: You -->
  <rect x="480" y="112" width="320" height="56" rx="12" fill="#12142a" stroke="#475569" stroke-width="1" filter="url(#card)"/>
  <circle cx="512" cy="140" r="10" fill="#334155"/>
  <text x="512" y="144" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">👤</text>
  <text x="536" y="138" fill="#e2e8f0" font-size="14" font-weight="700">You</text>
  <text x="536" y="155" fill="#94a3b8" font-size="10.5">dashboard :8443 · CLI · REST · WebSocket</text>

  <line x1="640" y1="168" x2="640" y2="196" stroke="#6366f1" stroke-width="2"/>
  <polygon points="634,192 640,204 646,192" fill="#6366f1"/>

  <!-- Layer 2: Orchestrator -->
  <rect x="380" y="206" width="520" height="64" rx="12" fill="#171a35" stroke="url(#indigo)" stroke-width="1.6" filter="url(#glow)"/>
  <text x="640" y="234" text-anchor="middle" fill="#c7d2fe" font-size="15" font-weight="800">Council Orchestrator — FastAPI</text>
  <text x="640" y="254" text-anchor="middle" fill="#94a3b8" font-size="11">ask · decompose · debate · stream · tasks · audit · search · vault · guard</text>

  <line x1="640" y1="270" x2="640" y2="300" stroke="#6366f1" stroke-width="2"/>
  <line x1="240" y1="300" x2="1040" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="240" y1="300" x2="240" y2="318" stroke="#6366f1" stroke-width="2"/>
  <line x1="640" y1="300" x2="640" y2="318" stroke="#6366f1" stroke-width="2"/>
  <line x1="1040" y1="300" x2="1040" y2="318" stroke="#6366f1" stroke-width="2"/>
  <polygon points="234,314 240,326 246,314" fill="#6366f1"/>
  <polygon points="634,314 640,326 646,314" fill="#6366f1"/>
  <polygon points="1034,314 1040,326 1046,314" fill="#6366f1"/>

  <!-- Layer 3: agents -->
  <g filter="url(#card)">
    <rect x="110" y="328" width="260" height="92" rx="14" fill="#0f1322" stroke="#10b981" stroke-width="1.4"/>
    <rect x="110" y="328" width="260" height="30" rx="14" fill="#10b981" opacity="0.14"/>
    <text x="240" y="349" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="800">🧙 HERMES</text>
    <text x="240" y="372" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">memory &amp; analysis</text>
    <text x="240" y="391" text-anchor="middle" fill="#94a3b8" font-size="10.5">brain → qwen2.5:3b</text>
    <text x="240" y="408" text-anchor="middle" fill="#64748b" font-size="10">gateway 18790 (optional)</text>

    <rect x="510" y="328" width="260" height="92" rx="14" fill="#0f1322" stroke="#3b82f6" stroke-width="1.4"/>
    <rect x="510" y="328" width="260" height="30" rx="14" fill="#3b82f6" opacity="0.14"/>
    <text x="640" y="349" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="800">🦞 OPENCLAW</text>
    <text x="640" y="372" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">action &amp; execution</text>
    <text x="640" y="391" text-anchor="middle" fill="#94a3b8" font-size="10.5">brain → qwen2.5:3b</text>
    <text x="640" y="408" text-anchor="middle" fill="#64748b" font-size="10">gateway 18789 (optional)</text>

    <rect x="910" y="328" width="260" height="92" rx="14" fill="#0f1322" stroke="#8b5cf6" stroke-width="1.4"/>
    <rect x="910" y="328" width="260" height="30" rx="14" fill="#8b5cf6" opacity="0.14"/>
    <text x="1040" y="349" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="800">🔧 AGENT ZERO</text>
    <text x="1040" y="372" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">builder &amp; review</text>
    <text x="1040" y="391" text-anchor="middle" fill="#94a3b8" font-size="10.5">brain → deepseek-coder</text>
    <text x="1040" y="408" text-anchor="middle" fill="#64748b" font-size="10">gateway 50001 (optional)</text>
  </g>

  <!-- backend fallback note -->
  <text x="640" y="444" text-anchor="middle" fill="#64748b" font-size="10.5">backend fallback per agent: external gateway 🟢 → local LLM (Ollama) 🟡 → explicit mock ⚪</text>

  <!-- Layer 4: vote -->
  <line x1="240" y1="420" x2="240" y2="462" stroke="#475569" stroke-width="1.5"/>
  <line x1="640" y1="420" x2="640" y2="462" stroke="#475569" stroke-width="1.5"/>
  <line x1="1040" y1="420" x2="1040" y2="462" stroke="#475569" stroke-width="1.5"/>
  <line x1="240" y1="462" x2="1040" y2="462" stroke="#475569" stroke-width="1.5"/>
  <line x1="640" y1="462" x2="640" y2="482" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="634,478 640,490 646,478" fill="#f59e0b"/>

  <rect x="430" y="492" width="420" height="58" rx="14" fill="#151228" stroke="url(#amber)" stroke-width="1.4" filter="url(#card)"/>
  <text x="640" y="517" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="800">⚖ COUNCIL VOTE</text>
  <text x="640" y="536" text-anchor="middle" fill="#94a3b8" font-size="10.5">majority · weighted · LLM judge · hermes decides — 2/3 consensus default</text>

  <!-- Layer 5: outputs -->
  <line x1="640" y1="550" x2="640" y2="574" stroke="#6366f1" stroke-width="2"/>
  <polygon points="634,570 640,582 646,570" fill="#6366f1"/>
  <line x1="640" y1="574" x2="213" y2="574" stroke="#475569" stroke-width="1.5"/>
  <line x1="640" y1="574" x2="1067" y2="574" stroke="#475569" stroke-width="1.5"/>
  <line x1="213" y1="574" x2="213" y2="596" stroke="#475569" stroke-width="1.5"/>
  <line x1="640" y1="574" x2="640" y2="596" stroke="#475569" stroke-width="1.5"/>
  <line x1="1067" y1="574" x2="1067" y2="596" stroke="#475569" stroke-width="1.5"/>

  <g filter="url(#card)">
    <rect x="73" y="598" width="280" height="66" rx="12" fill="#0f1322" stroke="#475569" stroke-width="1"/>
    <circle cx="104" cy="631" r="9" fill="#1e293b"/><text x="104" y="635" text-anchor="middle" font-size="11">📓</text>
    <text x="124" y="626" fill="#e2e8f0" font-size="12" font-weight="700">Journal + Audit</text>
    <text x="124" y="644" fill="#94a3b8" font-size="10">every decision, latency, consensus</text>

    <rect x="500" y="598" width="280" height="66" rx="12" fill="#0f1322" stroke="#475569" stroke-width="1"/>
    <circle cx="531" cy="631" r="9" fill="#1e293b"/><text x="531" y="635" text-anchor="middle" font-size="11">🧠</text>
    <text x="551" y="626" fill="#e2e8f0" font-size="12" font-weight="700">Memory + Knowledge</text>
    <text x="551" y="644" fill="#94a3b8" font-size="10">graph · TF-IDF search · RAG</text>

    <rect x="927" y="598" width="280" height="66" rx="12" fill="#0f1322" stroke="#475569" stroke-width="1"/>
    <circle cx="958" cy="631" r="9" fill="#1e293b"/><text x="958" y="635" text-anchor="middle" font-size="11">💾</text>
    <text x="978" y="626" fill="#e2e8f0" font-size="12" font-weight="700">Storage split</text>
    <text x="978" y="644" fill="#94a3b8" font-size="10">keep distilled · cache auto-clean</text>
  </g>

  <!-- footer -->
  <text x="640" y="704" text-anchor="middle" fill="#475569" font-size="10">CouncilKey-Os v1.4 · python 3.11+ · MIT · dashboard http://localhost:8443</text>
</svg>
