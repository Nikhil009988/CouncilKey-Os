[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "councilkey-os"
version = "1.4.0"
description = "CouncilKey-Os - 3 AI agents live on a pendrive with voting dashboard"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
]
extras = [
    "pyyaml>=6",
    "lancedb>=0.10",
    "pyarrow>=15",
    "psutil>=5.9",
    "edge-tts>=6.1",
    "Pillow>=10",
]

[project.scripts]
councilkey = "council.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["council*", "tests*"]
exclude = ["images*", "docs*", "builder*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
